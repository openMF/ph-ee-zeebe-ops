server:
  port: 8080
  address: 0.0.0.0
  
camel:
  server-port: 5000
  springboot:
    main-run-controller: true
  dataformat:
    json-jackson:
      auto-discover-object-mapper: true

tenants: "ibank-india,ibank-usa"

zeebe:
  client:
    max-execution-threads: 100
    number-of-workers: 5
    evenly-allocated-max-jobs: "#{${zeebe.client.max-execution-threads} / ${zeebe.client.number-of-workers}}"
  broker:
    contactpoint: "localhost:26500"

spring:
  data:
    elasticsearch:
      client:
        reactive:
          endpoints: "localhost:9200"

logging:
  level:
    root: INFO

elasticsearch:
  url: "https://ph-ee-elasticsearch:9200/"
  security:
    enabled: false
  sslVerification: false
  username: "elastic"
  password: "spmepassword"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      liveness:
        enabled: true
      readiness:
        enabled: true
  health:
    # Spring Boot 3 auto-configures an Elasticsearch health indicator pointing at the default
    # localhost:9200, which isn't the ES client this connector uses (it has its own /es/health
    # Camel route). That default probe fails (Connection refused) and drags the aggregate
    # /actuator/health to DOWN, so disable it. The k8s liveness/readiness groups are unaffected.
    elasticsearch:
      enabled: false

